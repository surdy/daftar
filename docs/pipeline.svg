<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Pipeline diagram: a coding session is captured by munshi, archived by patwari, and read back by qanungo, which mirrors the archive and derives everything at read time." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">
  <title>daftar pipeline: session to munshi to patwari to qanungo</title>
  <style>
    .box   { fill: #4b5563; fill-opacity: 0.06; stroke: #6b7280; stroke-width: 1; }
    .plain { fill: none; stroke: #6b7280; stroke-width: 1; }
    .ttl   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 680; fill: #3f4753; }
    .lbl   { font-size: 10.5px; fill: #4b5563; }
    .sub   { font-size: 9px; fill: #5b6472; }
    .flow  { stroke: #6b7280; stroke-width: 1.2; fill: none; }
    .cyan  { fill: #0e7c8e; }  .cyan-s  { stroke: #0e7c8e; }
    .purp  { fill: #6d43dd; }  .purp-s  { stroke: #6d43dd; }
    .amber { fill: #9a6b06; }  .amber-s { stroke: #9a6b06; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #9ca3af; fill-opacity: 0.10; stroke: #8b929e; }
      .plain { stroke: #8b929e; }
      .ttl   { fill: #ced3da; }
      .lbl   { fill: #b6bcc5; }
      .sub   { fill: #9aa1ab; }
      .flow  { stroke: #8b929e; }
      .cyan  { fill: #46c9dc; }  .cyan-s  { stroke: #46c9dc; }
      .purp  { fill: #ab90fb; }  .purp-s  { stroke: #ab90fb; }
      .amber { fill: #ddaa4a; }  .amber-s { stroke: #ddaa4a; }
    }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6b06"/>
    </marker>
  </defs>

  <!-- capture path, top band -->
  <rect class="box" x="14" y="78" width="140" height="60" rx="10"/>
  <text class="ttl" x="84" y="102" text-anchor="middle" font-size="12">session</text>
  <text class="sub" x="84" y="120" text-anchor="middle">claude · copilot · codex</text>

  <rect class="plain cyan-s" x="176" y="78" width="128" height="60" rx="10" stroke-width="1.4"/>
  <text class="ttl cyan" x="240" y="102" text-anchor="middle" font-size="12">munshi</text>
  <text class="sub" x="240" y="120" text-anchor="middle">capture · normalize</text>

  <rect class="plain purp-s" x="326" y="78" width="140" height="60" rx="10" stroke-width="1.4"/>
  <text class="ttl purp" x="396" y="102" text-anchor="middle" font-size="12">patwari</text>
  <text class="sub" x="396" y="120" text-anchor="middle">permanent archive</text>

  <line class="flow" x1="154" y1="108" x2="172" y2="108" marker-end="url(#ar)"/>
  <line class="flow" x1="304" y1="108" x2="322" y2="108" marker-end="url(#ar)"/>
  <text class="lbl" x="240" y="52" text-anchor="middle" font-size="10">capture path — no server on the dev box</text>

  <!-- shared read contract -->
  <rect class="box cyan-s" x="176" y="176" width="290" height="52" rx="10" stroke-width="1.4"/>
  <text class="ttl cyan" x="321" y="198" text-anchor="middle" font-size="12">munshi-transcript</text>
  <text class="sub" x="321" y="216" text-anchor="middle">shared read contract · typed events</text>
  <line class="flow" x1="396" y1="138" x2="370" y2="172" marker-end="url(#ar)"/>

  <!-- optional notes sink -->
  <rect class="box" x="500" y="176" width="170" height="52" rx="10"/>
  <text class="ttl" x="585" y="198" text-anchor="middle" font-size="12">notes sink</text>
  <text class="sub" x="585" y="216" text-anchor="middle">optional · curated prose</text>

  <!-- qanungo box -->
  <rect class="plain amber-s" x="176" y="266" width="632" height="152" rx="14" stroke-width="1.7"/>
  <text class="ttl amber" x="196" y="292" font-size="15">qanungo</text>
  <text class="sub" x="266" y="292" font-size="9.5">read-side client (munshi ADR 0012) · disposable mirror, re-derivable (ADR 0011)</text>

  <rect class="box" x="192" y="308" width="116" height="92" rx="8"/>
  <text class="lbl" x="250" y="336" text-anchor="middle" font-size="10">mirror +</text>
  <text class="lbl" x="250" y="352" text-anchor="middle" font-size="10">in-memory svc</text>
  <text class="sub" x="250" y="372" text-anchor="middle" font-size="8.5">pre-folded views</text>

  <rect class="box" x="320" y="308" width="116" height="92" rx="8"/>
  <text class="lbl" x="378" y="346" text-anchor="middle" font-size="10">derive metrics</text>
  <text class="sub" x="378" y="366" text-anchor="middle" font-size="8.5">read-time fold</text>

  <rect class="box" x="448" y="308" width="116" height="92" rx="8"/>
  <text class="lbl" x="506" y="346" text-anchor="middle" font-size="10">rule engine</text>
  <text class="sub" x="506" y="366" text-anchor="middle" font-size="8.5">8 hardcoded rules</text>

  <rect class="box" x="576" y="308" width="116" height="92" rx="8"/>
  <text class="lbl" x="634" y="346" text-anchor="middle" font-size="10">score + trends</text>
  <text class="sub" x="634" y="366" text-anchor="middle" font-size="8.5">5 lanes</text>

  <rect class="box amber-s" x="704" y="308" width="88" height="92" rx="8"/>
  <text class="lbl amber" x="748" y="340" text-anchor="middle" font-size="10">dashboard</text>
  <text class="sub" x="748" y="358" text-anchor="middle" font-size="8.5">private net</text>
  <text class="sub" x="748" y="372" text-anchor="middle" font-size="8.5">JSON + SSE</text>

  <!-- internal flow arrows -->
  <line class="flow" x1="308" y1="354" x2="316" y2="354" marker-end="url(#ar)"/>
  <line class="flow" x1="436" y1="354" x2="444" y2="354" marker-end="url(#ar)"/>
  <line class="flow" x1="564" y1="354" x2="572" y2="354" marker-end="url(#ar)"/>
  <line class="flow" x1="692" y1="354" x2="700" y2="354" marker-end="url(#ar)"/>
  <line class="flow amber-s" x1="230" y1="228" x2="230" y2="304" marker-end="url(#arA)"/>

  <!-- reader -->
  <rect class="box" x="836" y="326" width="112" height="56" rx="10"/>
  <text class="ttl" x="892" y="349" text-anchor="middle" font-size="11.5">any browser</text>
  <text class="sub" x="892" y="366" text-anchor="middle">laptop · phone · tv</text>
  <line class="flow amber-s" x1="792" y1="354" x2="832" y2="354" marker-end="url(#arA)"/>

  <!-- evidence link back to patwari -->
  <path class="flow" d="M466 108 C 700 108, 740 200, 748 304" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text class="sub" x="700" y="146" text-anchor="middle">evidence is a content hash —</text>
  <text class="sub" x="700" y="160" text-anchor="middle">redeem it in your own shell</text>
</svg>
